name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Test & Bundle Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: task install

      - name: Lint & Formatting Check
        run: task lint

      - name: Run Test Suite
        run: task test

      - name: Verify Visual Snapshots
        run: task snapshots:check

      - name: Upload Visual Snapshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: |
            snapshots/*.png
            tests/.snapshot-tmp/**

      - name: Verify Single-Bundle Synchronization
        run: task build -- --check
