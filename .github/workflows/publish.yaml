# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pages:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: cache-node-modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}

      - name: build-docs
        uses: juftin/actions/taskfile@v1
        with:
          task: docs
          checkout: false
          install: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: github-pages
        uses: juftin/actions/github-pages@v1
        id: deployment
