# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  ########################
  # DEFAULT TASK
  ########################
  default:
    desc: List Available Tasks
    cmds:
      - task --list-all --sort alphanumeric
    silent: true
  ########################
  # INSTALL AND DEPENDENCIES
  ########################
  install:
    desc: Install Project + Dev Dependencies
    cmds:
      - task: pre-commit-install
      - task: sync
  ########################
  # TESTING
  ########################
  test:
    desc: Run Tests
    cmds:
      - npm test -- {{.CLI_ARGS}}
    deps: [sync]
  #######################################
  snapshots:
    desc: Generate Visual PNG Snapshots
    cmds:
      - node scripts/generate-snapshots.js {{.CLI_ARGS}}
    deps: [sync]
  #######################################
  snapshots:check:
    desc: Verify Visual PNG Snapshots against Baselines
    cmds:
      - node scripts/generate-snapshots.js --check {{.CLI_ARGS}}
    deps: [sync]
  ########################
  # CODE QUALITY CHECKS
  ########################
  check:format:
    desc: Code Quality Check - Formatting
    cmds:
      - npm run format:check
    deps: [sync]
  #######################################
  check:lint:
    desc: Code Quality Check - Linting
    cmds:
      - npm run lint
    deps: [sync]
  #######################################
  check:style:
    desc: Code Quality Check - Formatting + Linting
    cmds:
      - task: check:format
      - task: check:lint
  #######################################
  check:types:
    desc: Code Quality Check - Type Checking
    cmds:
      - npm run typecheck
    deps: [sync]
  #######################################
  check:knip:
    desc: Code Quality Check - Unused Code and Dependencies
    cmds:
      - npm run knip
    deps: [sync]
  #######################################
  check:build:
    desc: Code Quality Check - Bundle Synchronization
    cmds:
      - node scripts/build.js --check
    deps: [sync]
  #######################################
  check:
    desc: Code Quality Check - Formatting + Linting + Type Checking + Knip + Build Check + Test
    cmds:
      - task: check:style
      - task: check:types
      - task: check:knip
      - task: test
      - task: check:build
  #######################################
  lint:
    desc: Code Quality Check - Formatting + Linting
    cmds:
      - task: check:style
  #######################################
  typecheck:
    desc: Code Quality Check - Type Checking
    cmds:
      - task: check:types
  ########################
  # CODE QUALITY FIXES
  ########################
  fmt:
    desc: Code Quality Auto-Fix - Formatting
    cmds:
      - npm run format
    deps: [sync]
  #######################################
  fix:
    desc: Code Quality Auto-Fix - Formatting + Linting
    cmds:
      - task: fmt
      - npm run lint:fix
    deps: [sync]
  ########################
  # BUILD AND DISTRIBUTION
  ########################
  build:
    desc: Build Production Bundles and Standalone HTML
    cmds:
      - node scripts/build.js {{.CLI_ARGS}}
    deps: [sync]
  ########################
  # DOCUMENTATION AND DEVELOPMENT
  ########################
  docs:
    desc: Build Site Distribution for GitHub Pages
    cmds:
      - npm run docs
    deps: [sync]
  #######################################
  dev:
    desc: Start Local Development Preview Server
    cmds:
      - npm run dev
    deps: [sync]
  ########################
  # INTERNAL TASKS
  ########################
  sync:
    desc: Install Project Dependencies
    internal: true
    cmds:
      - npm install {{.CLI_ARGS}}
  #######################################
  pre-commit-install:
    desc: Install Pre-Commit Hooks
    internal: true
    cmds:
      - cmd: |
          if [ "{{.CI | default 0}}" = "0" ]; then
              uv tool run --isolated pre-commit install --install-hooks
          fi
        silent: true
    status:
      - test ! -f {{.ROOT_DIR}}/.pre-commit-config.yaml
