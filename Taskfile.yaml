version: "3"

tasks:
  default:
    desc: Run standard verification suite (lint, test, build check)
    cmds:
      - task: check

  install:
    desc: Install project dependencies
    cmds:
      - npm install

  build:
    desc: Build production bundles and standalone HTML into dist/
    cmds:
      - node scripts/build.js {{.CLI_ARGS}}

  format:
    desc: Format code using Prettier
    cmds:
      - npm run format

  lint:
    desc: Check code quality and formatting
    cmds:
      - npm run format:check
      - npm run lint

  fix:
    desc: Auto-fix formatting and linting issues
    cmds:
      - npm run format
      - npm run lint:fix

  test:
    desc: Run automated test suite
    cmds:
      - npm test {{.CLI_ARGS}}

  typecheck:
    desc: Check TypeScript types
    cmds:
      - npm run typecheck

  snapshots:
    desc: Generate visual PNG snapshots for dashboard tabs and modals
    cmds:
      - node scripts/generate-snapshots.js

  snapshots:check:
    desc: Verify visual PNG snapshots against baselines
    cmds:
      - node scripts/generate-snapshots.js --check

  check:
    desc: Complete verification pipeline (lint, test, build sync check)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - node scripts/build.js --check

  docs:
    desc: Build site distribution for GitHub Pages
    cmds:
      - npm run docs

  dev:
    desc: Start local development preview server
    cmds:
      - npm run dev
