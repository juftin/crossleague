<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossLeague • Multi-League Fantasy Dashboard</title>
    <script>
      try {
        if (localStorage.getItem("crossleague_theme") === "light") {
          document.documentElement.classList.replace("dark", "light");
        }
      } catch {}
    </script>
    <script data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
    <script data-cfasync="false" src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script data-cfasync="false" src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script data-cfasync="false">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "Inter", "sans-serif"]
            },
            colors: {
              brand: {
                50: "#ecfdf5",
                100: "#d1fae5",
                400: "#34d399",
                500: "#10b981",
                600: "#059669",
                700: "#047857"
              },
              sleeper: {
                cyan: "#00ceb8",
                blue: "#0284c7",
                navy: "#0f172a",
                card: "rgba(15, 23, 42, 0.75)"
              }
            },
            animation: {
              shimmer: "shimmer 2s infinite linear",
              "pulse-glow": "pulseGlow 2.5s infinite ease-in-out"
            },
            keyframes: {
              shimmer: {
                "0%": { backgroundPosition: "-1000px 0" },
                "100%": { backgroundPosition: "1000px 0" }
              },
              pulseGlow: {
                "0%, 100%": { opacity: "0.6", transform: "scale(1)" },
                "50%": { opacity: "1", transform: "scale(1.02)" }
              }
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
