# yaml-language-server: $schema=https://schemastore.org/pre-commit-config.json

repos:
  - repo: local
    hooks:
      - id: task-format
        name: Code Quality & Formatting Check (Prettier)
        entry: task check:format
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: task-lint
        name: Code Quality & Linting (ESLint)
        entry: task check:lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: task-typecheck
        name: TypeScript Type Checking (tsc)
        entry: task check:types
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: task-knip
        name: Dead Code & Dependency Analysis (knip)
        entry: task check:knip
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: task-check
        name: Full Verification Pipeline & Visual Snapshots (Taskfile)
        entry: task check
        language: system
        pass_filenames: false
        stages: [pre-push]
