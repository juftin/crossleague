<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="CrossLeague Football with Lightning Bolt Logo">
  <defs>
    <!-- Primary Brand Lightning Bolt Gradient -->
    <linearGradient id="crossBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Stencil Mask: Uniform 14px negative-space clearance slice parting the football -->
    <mask id="crossStencilMask">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff" />
      <polygon points="197.0,-25.0 356.0,227.0 284.0,246.0 346.0,537.0 167.0,286.0 238.0,266.0" fill="#000000" />
    </mask>
  </defs>

  <!-- FOOTBALL (Clean Stencil Silhouette parted by negative-space channel) -->
  <g mask="url(#crossStencilMask)" transform="translate(256, 256) rotate(-30)">
    <!-- Ball Body -->
    <path d="M -180 0 C -120 -116, 120 -116, 180 0 C 120 116, -120 116, -180 0 Z"
          fill="#10b981" stroke="#059669" stroke-width="4" stroke-linejoin="round" />

    <!-- Left Stripe -->
    <path d="M -124 -68 C -138 -25, -138 25, -124 68 L -104 78 C -118 25, -118 -25, -104 -78 Z"
          fill="#ffffff" />

    <!-- Right Stripe -->
    <path d="M 104 -78 C 118 -25, 118 25, 104 78 L 124 68 C 138 25, 138 -25, 124 -68 Z"
          fill="#ffffff" />

    <!-- Center Seam -->
    <line x1="-72" y1="0" x2="72" y2="0" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- Stitched Laces -->
    <rect x="-56" y="-18" width="8" height="36" rx="4" fill="#ffffff" />
    <rect x="-34" y="-20" width="8" height="40" rx="4" fill="#ffffff" />
    <rect x="-12" y="-21" width="8" height="42" rx="4" fill="#ffffff" />
    <rect x="10" y="-21" width="8" height="42" rx="4" fill="#ffffff" />
    <rect x="32" y="-20" width="8" height="40" rx="4" fill="#ffffff" />
    <rect x="54" y="-18" width="8" height="36" rx="4" fill="#ffffff" />
  </g>

  <!-- LIGHTNING BOLT (Razor 6-Point Geometric Vector) -->
  <polygon points="220.0,38.0 334.0,218.0 268.0,236.0 318.0,474.0 190.0,294.0 254.0,276.0"
           fill="url(#crossBoltGrad)" stroke="#67e8f9" stroke-width="3" stroke-linejoin="round" />

  <!-- Clean Bevel Facet (Athletic depth without blur filters) -->
  <polygon points="220.0,38.0 334.0,218.0 268.0,236.0 254.0,276.0"
           fill="#ffffff" opacity="0.25" />
</svg>
