<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="CrossLeague Football with Lightning Bolt Logo">
  <defs>
    <!-- Ambient Shadow Filter -->
    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- High-Voltage Electric Glow Filter -->
    <filter id="electricGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Aura Background -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Football Body: Sleek Midnight Slate -->
    <linearGradient id="ballLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Football Contour Edge Illumination -->
    <linearGradient id="ballBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- 3D Surface Light & Shadow -->
    <linearGradient id="ballSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Piercing Lightning Bolt Gradient: Sunburst Yellow into Neon Mint & Electric Cyan -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Pure White-Hot Bolt Core Highlight -->
    <linearGradient id="boltCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cffafe" />
    </linearGradient>

    <!-- Football Outline Clipping Path -->
    <clipPath id="ballClip">
      <path d="M -176 0 C -116 -120, 116 -120, 176 0 C 116 120, -116 120, -176 0 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Energy Aura -->
  <circle cx="256" cy="256" r="225" fill="url(#auraGlow)" />

  <!-- FOOTBALL (Tilted at -28° for aerodynamic athletic posture) -->
  <g id="football-body" transform="translate(256, 256) rotate(-28)" filter="url(#ballShadow)">
    <!-- Illuminated Outer Rim -->
    <path d="M -180 0 C -119 -124, 119 -124, 180 0 C 119 124, -119 124, -180 0 Z"
          fill="none" stroke="url(#ballBorderGrad)" stroke-width="5" />

    <!-- Football Leather Shell -->
    <path d="M -176 0 C -116 -120, 116 -120, 176 0 C 116 120, -116 120, -176 0 Z"
          fill="url(#ballLeather)" />

    <!-- Surface Shading & End Stripes (Clipped to ball profile) -->
    <g clip-path="url(#ballClip)">
      <!-- 3D Specular Sheen -->
      <path d="M -176 0 C -116 -120, 116 -120, 176 0 C 116 120, -116 120, -176 0 Z"
            fill="url(#ballSheen)" />

      <!-- Left White Stripe Band -->
      <path d="M -122 -72 C -136 -25, -136 25, -122 72 L -100 83 C -114 25, -114 -25, -100 -83 Z"
            fill="#f8fafc" />
      <path d="M -122 -72 C -136 -25, -136 25, -122 72"
            stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />

      <!-- Right White Stripe Band -->
      <path d="M 100 -83 C 114 -25, 114 25, 100 83 L 122 72 C 136 25, 136 -25, 122 -72 Z"
            fill="#f8fafc" />
      <path d="M 122 -72 C 136 -25, 136 25, 122 72"
            stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
    </g>

    <!-- Longitudinal Center Seam -->
    <line x1="-80" y1="0" x2="-35" y2="0" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
    <line x1="35" y1="0" x2="80" y2="0" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />

    <!-- Laces: Split around the cleaving lightning bolt channel -->
    <!-- Left Laces (3 stitches) -->
    <g id="laces-left" fill="#ffffff">
      <rect x="-62" y="-18" width="7" height="36" rx="3.5" />
      <rect x="-44" y="-20" width="7.5" height="40" rx="3.75" />
      <rect x="-26" y="-21" width="7.5" height="42" rx="3.75" />
      <!-- Stitch drop shadows -->
      <rect x="-62" y="-18" width="7" height="36" rx="3.5" fill="none" stroke="#64748b" stroke-width="0.75" />
      <rect x="-44" y="-20" width="7.5" height="40" rx="3.75" fill="none" stroke="#64748b" stroke-width="0.75" />
      <rect x="-26" y="-21" width="7.5" height="42" rx="3.75" fill="none" stroke="#64748b" stroke-width="0.75" />
    </g>

    <!-- Right Laces (3 stitches) -->
    <g id="laces-right" fill="#ffffff">
      <rect x="18" y="-21" width="7.5" height="42" rx="3.75" />
      <rect x="36" y="-20" width="7.5" height="40" rx="3.75" />
      <rect x="54" y="-18" width="7" height="36" rx="3.5" />
      <!-- Stitch drop shadows -->
      <rect x="18" y="-21" width="7.5" height="42" rx="3.75" fill="none" stroke="#64748b" stroke-width="0.75" />
      <rect x="36" y="-20" width="7.5" height="40" rx="3.75" fill="none" stroke="#64748b" stroke-width="0.75" />
      <rect x="54" y="-18" width="7" height="36" rx="3.5" fill="none" stroke="#64748b" stroke-width="0.75" />
    </g>

    <!-- Center Lace Horizontal Spines -->
    <rect x="-64" y="-3.5" width="44" height="7" rx="3.5" fill="#f8fafc" />
    <rect x="20" y="-3.5" width="44" height="7" rx="3.5" fill="#f8fafc" />
  </g>

  <!-- IMPACT & EXIT ELECTRICAL FRACTURES ON FOOTBALL SURFACE -->
  <path d="M 242 165 L 222 145 M 268 185 L 290 170"
        stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 248 340 L 228 355 M 274 322 L 298 335"
        stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- LIGHTNING BOLT PIERCING THROUGH THE FOOTBALL -->
  <!-- 1. Dark silhouette boundary (creates clean negative space cutout channel) -->
  <path d="M 230 12 L 326 206 L 248 232 L 338 506 L 194 306 L 272 280 Z"
        fill="#020617" opacity="0.96" />

  <!-- 2. Electric Aura Glow -->
  <path d="M 230 24 L 314 210 L 254 230 L 330 492 L 206 302 L 266 282 Z"
        fill="url(#boltGrad)" filter="url(#electricGlow)" opacity="0.7" />

  <!-- 3. Primary Bolt Body -->
  <path d="M 230 24 L 314 210 L 254 230 L 330 492 L 206 302 L 266 282 Z"
        fill="url(#boltGrad)" stroke="#67e8f9" stroke-width="2" stroke-linejoin="round" />

  <!-- 4. Pure White Hot Core -->
  <path d="M 230 36 L 302 210 L 258 224 L 320 472 L 218 300 L 262 286 Z"
        fill="url(#boltCore)" opacity="0.95" />

  <!-- 5. Dynamic Electric Sparks & Particles -->
  <!-- Top Strike Sparks -->
  <line x1="228" y1="20" x2="205" y2="8" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
  <line x1="235" y1="35" x2="260" y2="22" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" />
  <circle cx="198" cy="12" r="3" fill="#fef08a" />
  <circle cx="265" cy="24" r="2.5" fill="#ffffff" />

  <!-- Core Fracture Energy Sparks -->
  <circle cx="318" cy="208" r="3" fill="#ffffff" />
  <line x1="316" y1="210" x2="338" y2="198" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <circle cx="204" cy="304" r="3" fill="#ffffff" />
  <line x1="204" y1="304" x2="182" y2="316" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />

  <!-- Bottom Needle Exit Sparks -->
  <line x1="332" y1="494" x2="354" y2="512" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
  <line x1="324" y1="485" x2="306" y2="502" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <circle cx="358" cy="515" r="3" fill="#ecfeff" />
  <circle cx="300" cy="505" r="2.5" fill="#34d399" />
</svg>
