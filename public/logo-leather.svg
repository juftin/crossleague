<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Classic Gridiron Football with Lightning Bolt Logo">
  <defs>
    <!-- Ambient Shadow Filter -->
    <filter id="leatherShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- High-Voltage Electric Glow Filter -->
    <filter id="leatherElectricGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Rich Football Leather Gradient -->
    <linearGradient id="authenticLeather" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#78350f" />
      <stop offset="75%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c0a00" />
    </linearGradient>

    <!-- Warm Rim Highlight -->
    <linearGradient id="warmRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.2" />
    </linearGradient>

    <!-- 3D Surface Light & Shadow -->
    <linearGradient id="leatherSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#fef3c7" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </linearGradient>

    <!-- Piercing Lightning Bolt Gradient: Sunburst Yellow into Emerald & Cyan -->
    <linearGradient id="leatherBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Pure White-Hot Bolt Core Highlight -->
    <linearGradient id="leatherBoltCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfeff" />
    </linearGradient>

    <!-- Football Outline Clipping Path -->
    <clipPath id="leatherClip">
      <path d="M -176 0 C -116 -120, 116 -120, 176 0 C 116 120, -116 120, -176 0 Z" />
    </clipPath>
  </defs>

  <!-- FOOTBALL (Tilted at -28°) -->
  <g id="football-leather-body" transform="translate(256, 256) rotate(-28)" filter="url(#leatherShadow)">
    <!-- Illuminated Outer Rim -->
    <path d="M -180 0 C -119 -124, 119 -124, 180 0 C 119 124, -119 124, -180 0 Z"
          fill="none" stroke="url(#warmRim)" stroke-width="5" />

    <!-- Football Leather Shell -->
    <path d="M -176 0 C -116 -120, 116 -120, 176 0 C 116 120, -116 120, -176 0 Z"
          fill="url(#authenticLeather)" />

    <!-- Surface Shading & End Stripes (Clipped to ball profile) -->
    <g clip-path="url(#leatherClip)">
      <path d="M -176 0 C -116 -120, 116 -120, 176 0 C 116 120, -116 120, -176 0 Z"
            fill="url(#leatherSheen)" />

      <!-- Left White Stripe Band -->
      <path d="M -122 -72 C -136 -25, -136 25, -122 72 L -100 83 C -114 25, -114 -25, -100 -83 Z"
            fill="#ffffff" />
      <!-- Right White Stripe Band -->
      <path d="M 100 -83 C 114 -25, 114 25, 100 83 L 122 72 C 136 25, 136 -25, 122 -72 Z"
            fill="#ffffff" />
    </g>

    <!-- Longitudinal Center Seam -->
    <line x1="-80" y1="0" x2="-35" y2="0" stroke="#2d1204" stroke-width="4" stroke-linecap="round" />
    <line x1="35" y1="0" x2="80" y2="0" stroke="#2d1204" stroke-width="4" stroke-linecap="round" />

    <!-- Laces -->
    <g fill="#ffffff">
      <rect x="-62" y="-18" width="7" height="36" rx="3.5" />
      <rect x="-44" y="-20" width="7.5" height="40" rx="3.75" />
      <rect x="-26" y="-21" width="7.5" height="42" rx="3.75" />
      <rect x="18" y="-21" width="7.5" height="42" rx="3.75" />
      <rect x="36" y="-20" width="7.5" height="40" rx="3.75" />
      <rect x="54" y="-18" width="7" height="36" rx="3.5" />
      <!-- Lace horizontal bridges -->
      <rect x="-64" y="-3.5" width="44" height="7" rx="3.5" />
      <rect x="20" y="-3.5" width="44" height="7" rx="3.5" />
    </g>
  </g>

  <!-- ELECTRICAL IMPACT FRACTURES ON FOOTBALL SURFACE -->
  <path d="M 242 165 L 222 145 M 268 185 L 290 170"
        stroke="#facc15" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 248 340 L 228 355 M 274 322 L 298 335"
        stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- LIGHTNING BOLT PIERCING THROUGH THE FOOTBALL -->
  <!-- 1. Dark silhouette boundary (creates clean negative space cutout channel) -->
  <path d="M 230 12 L 326 206 L 248 232 L 338 506 L 194 306 L 272 280 Z"
        fill="#0b0f19" opacity="0.96" />

  <!-- 2. Electric Aura Glow -->
  <path d="M 230 24 L 314 210 L 254 230 L 330 492 L 206 302 L 266 282 Z"
        fill="url(#leatherBoltGrad)" filter="url(#leatherElectricGlow)" opacity="0.7" />

  <!-- 3. Primary Bolt Body -->
  <path d="M 230 24 L 314 210 L 254 230 L 330 492 L 206 302 L 266 282 Z"
        fill="url(#leatherBoltGrad)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  <!-- 4. Pure White Hot Core -->
  <path d="M 230 36 L 302 210 L 258 224 L 320 472 L 218 300 L 262 286 Z"
        fill="url(#leatherBoltCore)" opacity="0.95" />

  <!-- 5. Dynamic Electric Sparks -->
  <line x1="228" y1="20" x2="205" y2="8" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="198" cy="12" r="3" fill="#fef08a" />
  <circle cx="318" cy="208" r="3" fill="#ffffff" />
  <circle cx="204" cy="304" r="3" fill="#ffffff" />
  <line x1="332" y1="494" x2="354" y2="512" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="358" cy="515" r="3" fill="#ecfeff" />
</svg>
